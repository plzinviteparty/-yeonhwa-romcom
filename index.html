<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이 동네 남자들은 왜 이래?</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#29352e;background:#f7f3ed}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:14px}header{padding:14px 0;border-bottom:1px solid #ddd}h1{font-size:clamp(20px,5vw,24px);margin:8px 0}h2{font-size:19px}small,.muted{color:#64736a}section{background:#fff;border:1px solid #e5e1d9;border-radius:18px;padding:15px;margin-top:14px}label{display:block;margin:12px 0 6px;font-weight:650}input,select,button{font:inherit;border-radius:11px;padding:12px;width:100%}input,select{border:1px solid #ccc;background:#fff}button{background:#355e4a;color:#fff;border:0;cursor:pointer;margin-top:10px}button.secondary{background:#e7ede8;color:#284734}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{width:auto;flex:1;min-width:105px}.hide{display:none!important}.bubble{padding:10px 12px;border-radius:13px;background:#f0f4f0;margin:8px 0;white-space:pre-wrap;font-size:15px;line-height:1.6}.bubble.me{background:#e7ecfa}.bubble strong{display:block;font-size:12px;margin-bottom:5px}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.status{font-size:13px;color:#627366}.suggest button{font-size:13px;line-height:1.4;padding:9px 10px;min-width:calc(50% - 8px)}.error{color:#a33;font-size:13px}#log{max-height:420px;overflow:auto}footer{font-size:12px;color:#718077;padding:20px 0}
</style></head><body><div class="wrap"><header><small>연화동 로맨틱 코미디 · 무료 시연 v0.3</small><h1>이 동네 남자들은 왜 이래?</h1></header>
<section id="setup"><h2>연화동에 오신 걸 환영합니다</h2><p class="muted">이사 온 주민의 정보를 설정해 주세요. 모두 성인 캐릭터입니다.</p><label for="name">이름</label><input id="name" value="김유진" maxlength="24"><label for="age">나이</label><input id="age" type="number" min="19" max="99" value="27"><label for="job">직업</label><select id="job"><option>회사원</option><option>프리랜서</option><option>취업 준비생</option><option>대학생</option><option>기타</option></select><label for="personality">성격</label><select id="personality"><option>솔직함</option><option>차분함</option><option>장난기 많음</option><option>신중함</option></select><button id="start" type="button">이사 시작하기</button><p id="setupError" class="error" role="alert"></p></section>
<section id="game" class="hide"><div class="meta"><div><b id="where">연화빌라</b><div class="status" id="clock"></div></div><div class="status" id="progress"></div></div><div id="log" aria-live="polite"></div><div class="suggest row" id="suggest"></div><label for="message">대사 또는 행동</label><input id="message" placeholder="하고 싶은 말을 입력하세요"><button id="send" type="button">말하기</button><div class="row"><button class="secondary" id="next" type="button">다음 장소로</button><button class="secondary" id="reset" type="button">처음부터</button></div><p class="status">규칙 기반 대화 시연입니다. 실제 생성형 AI는 연결되어 있지 않습니다.</p></section><footer>저장 데이터는 이 브라우저에만 보관됩니다. API 비용 0원.</footer></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), KEY='yeonhwa-romcom-v05';
const scenes=[
{place:'연화빌라 202호 앞',who:'서이준',intro:'이사 온 첫날. 203호 택배가 202호 현관을 가로막고 있다. 문이 열리더니 옆집 남자가 말한다.\n“그거 제 택배인데요.”',suggest:['문을 막고 있어서 옮기려고 했어요.','그쪽 택배 때문에 못 들어가잖아요.','훔치려다 들켰네요.']},
{place:'연화빌라 입구',who:'백지한',intro:'부동산 실장 백지한이 나타난다.\n“어? 이준이 형, 새 이웃이랑 인사했어?”\n서이준이 짧게 대답한다. “택배 때문에요.”',suggest:['두 분 원래 아는 사이예요?','집에 하자는 없는 거죠?','택배 때문에 벌써 친해졌네요.']},
{place:'연화편의점',who:'한시우',intro:'편의점 앞에서 후드티 차림의 남자가 통화 중이다. 점원 임하나가 계산대에서 고개를 든다.\n“어서 오세요. 필요한 거 있으시면 말씀하세요.”\n남자가 통화를 끊자 임하나가 말한다. “시우 씨, 외상값은요?”',suggest:['저 사람 누구예요?','외상 얘기는 못 들은 걸로 할게요.','생수 어디 있어요?']},
{place:'카페 오후 네 시',who:'강도윤',intro:'카페 사장이 메뉴판을 건넨다.\n“어서 오세요. 주문하시겠어요?”\n창가에 앉은 차유리가 노트북 화면을 보고 투덜거린다. “수정 요청이 또 왔네.”\n그때 한시우가 들어온다. “형, 나도 서비스.”\n“주문부터 해, 시우야.”',suggest:['아이스 아메리카노 주세요.','창가 자리 비어 있나요?','저분은 누구예요?']},
{place:'연화빌라 202호',who:'서이준',intro:'밤이 되어 돌아온 현관 앞에 관리실에서 배포한 분리수거 안내문이 꽂혀 있다.\n맞은편에서 서이준이 쓰레기봉투를 들고 나온다. “아, 안녕하세요.”',suggest:['안녕하세요.','분리수거는 어디에 내놓나요?','그냥 집으로 들어간다.']}
];
let state=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function add(who,text,me=false){const el=document.createElement('div');el.className='bubble'+(me?' me':'');const title=document.createElement('strong');title.textContent=who;const body=document.createElement('span');body.textContent=text;el.append(title,body);$('log').append(el);$('log').scrollTop=$('log').scrollHeight}
function scene(){const s=scenes[state.scene];$('where').textContent=s.place;$('clock').textContent='DAY 01 · '+['14:00','14:20','16:00','17:00','21:00'][state.scene];$('progress').textContent=(state.scene+1)+' / '+scenes.length+' 장면';$('log').innerHTML='';add('이야기',s.intro);$('suggest').innerHTML='';s.suggest.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=t;b.addEventListener('click',()=>reply(t));$('suggest').append(b)});$('next').textContent=state.scene===scenes.length-1?'첫날 마치기':'다음 장소로';save()}
function reply(t){
 t=String(t||'').trim();if(!t)return;
 add(state.name,t,true);
 const n=state.scene,s=scenes[n],previous=state.history.filter(x=>x.scene===n);
 const has=(...w)=>w.some(x=>t.includes(x));
 let intent='other';
 if(has('누구','이름','소개','정체','뉘신'))intent='identity';
 else if(has('어떻게 알아','왜 알아','집을 알아','호수를 알아'))intent='privacy';
 else if(has('불편','무서','수상','경계','신고','경찰','따라오'))intent='boundary';
 else if(has('안녕','반가'))intent='greeting';
 else if(has('감사','고마'))intent='thanks';
 else if(has('미안','죄송'))intent='apology';
 else if(has('택배','막고','못 들어','치워','옮기'))intent='parcel';
 else if(has('외상','갚','돈'))intent='debt';
 else if(has('친구','아는 사이','친해','동창'))intent='relationship';
 else if(has('집','하자','고장','수리'))intent='home';
 else if(has('커피','아메리카노','라테','주문','메뉴'))intent='order';
 else if(has('자리','앉아'))intent='seat';
 else if(has('생수','물','어디','찾아'))intent='location';
 else if(has('분리수거','쓰레기'))intent='recycle';
 else if(has('훔','도둑','농담','장난'))intent='joke';
 const R=[
 {identity:['“서이준입니다. 203호 살아요.”','“방금 말씀드렸는데요. 서이준입니다.”'],privacy:['“제가 집 호수를 어떻게 알겠습니까. 바로 옆집이라는 것 말고는요.”'],boundary:['“불편하셨다면 죄송합니다. 더 말 걸지 않을게요.”'],parcel:['“문을 막았네요. 제 잘못입니다. 죄송합니다.”','“네. 바로 치우겠습니다.”'],apology:['“아뇨. 제 택배가 문제였죠.”'],joke:['“...농담이시죠?” 그가 한 걸음 물러선다.'],greeting:['“안녕하세요.”'],thanks:['“별말씀을요.”'],other:['“네? 어떤 말씀인지 잘 모르겠습니다.”','“죄송하지만 다시 설명해 주시겠어요?”']},
 {identity:['“연화부동산 실장 백지한입니다. 계약할 때 뵀죠.”'],privacy:['“계약 담당자라 호수는 알고 있지만, 다른 사람한테 말하진 않습니다.”'],boundary:['“제가 너무 친한 척했나요? 죄송합니다. 업무 관련해서만 연락드릴게요.”'],relationship:['“이준이 형이랑 동네에서 오래 봤어요. 그 이상은 형한테 물어보세요.”'],home:['“하자 있으면 사진 찍어 연락 주세요. 확인하겠습니다.”'],greeting:['“안녕하세요. 이사는 잘 마치셨어요?”'],other:['“어떤 부분 말씀하시는 걸까요?”']},
 {identity:['“저요? 임하나예요. 여기 직원이고요.” 임하나가 편의점 밖을 가리킨다. “저쪽은 단골 한시우 씨예요.”','한시우가 멋쩍게 웃는다. “아, 저한테 물으신 거였어요? 한시우입니다.”'],privacy:['임하나가 눈썹을 찌푸린다. “집 호수까지 물어보는 사람이 있으면 조심하세요.”'],boundary:['임하나: “불편하시면 안쪽에서 계산하고 가세요. 제가 봐드릴게요.”'],debt:['임하나: “손님한테까지 들키셨네요.” 한시우가 시선을 피한다.'],location:['임하나: “생수는 오른쪽 끝 냉장고에 있어요.”'],greeting:['임하나: “어서 오세요.”'],other:['임하나: “찾으시는 물건 있으세요?”','임하나: “죄송해요, 무슨 뜻인지 잘 모르겠네요.”']},
 {identity:['“강도윤입니다. 여기 사장이에요.” 그가 카운터를 가리킨다. “저쪽 손님은 차유리 씨고요. 서로 아는 사이세요?”'],boundary:['강도윤: “불편하셨다면 죄송합니다. 편하게 이용하세요.”'],order:['강도윤: “네, 주문 도와드릴게요. 테이크아웃이세요?”'],seat:['강도윤: “창가 쪽은 손님이 계시고, 안쪽 자리는 비어 있습니다.”'],relationship:['강도윤: “시우랑은 오래 알았죠. 단골이에요.”'],debt:['강도윤: “그건 저희끼리 해결할 문제라서요.” 한시우가 조용히 고개를 끄덕인다.'],greeting:['강도윤: “어서 오세요. 주문 도와드릴까요?”'],other:['강도윤: “제가 잘 못 들었네요. 다시 말씀해 주시겠어요?”']},
 {identity:['“203호 서이준입니다. 아까 복도에서 뵀죠.”'],boundary:['“네. 그럼 들어가 보겠습니다.”'],recycle:['“빌라 뒤편에 분리수거장이 있습니다. 수요일 저녁에 내놓으시면 돼요.”'],greeting:['“안녕하세요.”'],thanks:['“아, 네. 별말씀을요.”'],other:['“그럼 먼저 들어가 보겠습니다.”']}
 ];
 const opts=R[n][intent]||R[n].other;
 const used=previous.filter(x=>x.intent===intent).length;
 let answer=opts[Math.min(used,opts.length-1)];
 if(used>=opts.length && intent!=='other' && used>1)answer='“그 부분은 이미 말씀드린 것 같은데요.”';
 if(intent==='boundary')state.boundaries[n]=true;
 if(state.boundaries[n] && intent!=='boundary' && intent!=='identity' && intent!=='recycle' && intent!=='order')answer=['“알겠습니다. 필요한 일만 말씀해 주세요.”','“네. 용건이 없으시면 이만.”','임하나: “필요하신 물건만 말씀해 주세요.”','강도윤: “주문하실 때 불러 주세요.”','“네. 그럼 들어가겠습니다.”'][n];
 const speaker=n===2?'임하나':n===3?'강도윤':s.who;
 answer=answer.replace(/^(임하나|강도윤|한시우|서이준):\s*/,'');
 add(speaker,answer);
 state.history.push({scene:n,input:t,response:answer,intent});save();
}
function start(){const name=$('name').value.trim();const age=Number($('age').value);if(!name){$('setupError').textContent='이름을 입력해 주세요.';return}if(!Number.isInteger(age)||age<19||age>99){$('setupError').textContent='나이는 19세부터 99세까지 입력해 주세요.';return}state={name,age,job:$('job').value,personality:$('personality').value,scene:0,history:[],boundaries:{}};$('setup').classList.add('hide');$('game').classList.remove('hide');scene()}
$('start').addEventListener('click',start);$('send').addEventListener('click',()=>{reply($('message').value);$('message').value='';$('message').focus()});$('message').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('next').addEventListener('click',()=>{if(state.scene<scenes.length-1){state.scene++;scene()}else{add('이야기','첫날 체험 완료! 다음 업데이트에서 둘째 날이 열립니다.');$('next').disabled=true;save()}});$('reset').addEventListener('click',()=>{if(confirm('처음부터 다시 시작할까요?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}});
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.name&&Number.isInteger(old.scene)&&old.scene>=0&&old.scene<scenes.length){state=old;state.boundaries=state.boundaries||{};$('setup').classList.add('hide');$('game').classList.remove('hide');scene();add('시스템','이전 진행 상태를 불러왔습니다.')}}catch(e){}
})();
</script></body></html>
